services:
  flare:
    image: soulteary/flare:0.6.8
    restart: always
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # 启动前设置 FLARE_PASS；已有部署保留有效的原密码源。
    command: flare
    environment:
      FLARE_DISABLE_LOGIN: "false"
      FLARE_VISIBILITY: "DEFAULT"
      FLARE_USER: "${FLARE_USER:-flare}"
      FLARE_PASS: "${FLARE_PASS:?Set FLARE_PASS before starting Flare}"
    ports:
      # 根据自己需求设置端口，如需调整访问端口为 8080，
      # 可参考修改为 `- 8080:5005`
      - 5005:5005
    volumes:
      - ./app:/app
